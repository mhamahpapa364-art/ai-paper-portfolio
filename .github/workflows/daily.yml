name: Daily check

on:
  schedule:
    - cron: "45 22 * * 1-5"   # หลังตลาด US ปิดทุกวัน (~05:45 เวลาไทย): ซื้อขายที่ราคาเปิด + ตรวจเหตุฉุกเฉิน
  workflow_dispatch:
    inputs:
      no_ai:
        description: "ตรวจอย่างเดียว ไม่เรียก AI"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Daily
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "${{ inputs.no_ai }}" = "true" ]; then python -m src.run_daily --no-ai; else python -m src.run_daily; fi
      - name: Commit
        if: success()
        run: |
          git config user.name "ai-portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "daily $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main && git push
      - name: Alert on crash
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/ai_portfolio_alert_sent" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ AI Paper Portfolio: การตรวจรายวันล้มเหลว — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
