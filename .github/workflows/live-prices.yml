name: Live prices

# One long-running job per half-session instead of many short cron runs:
# GitHub often delays or drops frequent schedules, but a single start per session is reliable.
on:
  # GitHub delays scheduled starts by up to ~3 h at busy times, so jobs start EARLY and wait for the open.
  # Only one job runs at a time; a queued job takes over when the previous one hands off (~5h40m).
  schedule:
    - cron: "7 10 * * 1-5"    # ~17:07 Bangkok: start waiting for the open
    - cron: "37 12 * * 1-5"   # backup start
    - cron: "7 16 * * 1-5"    # takes over the second half of the session
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update every 5 minutes while the US market is open
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          publish() {
            rm -rf pub && mkdir pub && cp out/live.json pub/
            (cd pub && git init -q -b live && git config user.name "ai-portfolio-bot" \
              && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
              && git add live.json && git commit -qm "live prices" \
              && git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" live) || echo "push failed"
          }
          mkdir -p out
          start=$(date +%s)
          set +e
          # wait (up to ~4 h) if we started before the open
          while [ "$(python -m src.live_prices --status)" = "pre" ] && [ $(( $(date +%s) - start )) -lt 14400 ]; do sleep 60; done
          python -m src.live_prices out/live.json; rc=$?
          if [ $rc -eq 3 ]; then
            # market closed: a manual run still refreshes once, a scheduled run just exits
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python -m src.live_prices out/live.json --force && publish; fi
            exit 0
          fi
          while true; do
            [ $rc -eq 0 ] && publish
            [ $(( $(date +%s) - start )) -gt 20400 ] && break   # hand over to the next job before the 6 h limit
            sleep 300
            python -m src.live_prices out/live.json; rc=$?
            [ $rc -eq 3 ] && break
          done
          exit 0
