name: Discord organizer

# จัดระเบียบ Discord server ตาม discord_bot/server_template.json (ดูขั้นตอนใน discord_bot/README.md)
# เริ่มด้วย mode=preview เสมอ — ยังไม่ทำอะไรจริง แค่แสดงแผนใน log

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = ดูแผนเฉย ๆ · setup = สร้างเฉพาะที่ขาด · reorganize = จัดใหม่ทั้งหมด (ลบยศเดิม ย้ายห้องเดิมไป Archive)"
        type: choice
        options: [preview, setup, reorganize]
        default: preview
      guild_id:
        description: "Server ID (Discord: Developer Mode → คลิกขวาไอคอน server → Copy Server ID)"
        required: true
      admin_user_id:
        description: "User ID ของคุณ (ใช้ตอน reorganize เพื่อให้ยศ Admin กับคุณ)"
        required: false
      confirm:
        description: "พิมพ์ RESET เฉพาะตอนเลือก reorganize"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r discord_bot/requirements.txt
      - name: Run
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MODE: ${{ inputs.mode }}
          GUILD_ID: ${{ inputs.guild_id }}
          ADMIN_USER_ID: ${{ inputs.admin_user_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          python -m discord_bot.run_once --mode "$MODE" --guild-id "$GUILD_ID" \
            --admin-user-id "$ADMIN_USER_ID" --confirm "$CONFIRM"
