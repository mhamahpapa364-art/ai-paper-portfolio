name: Weekly run

on:
  schedule:
    - cron: "17 1 * * 6"   # ทุกวันเสาร์ ~08:17 เวลาไทย (หลังตลาด US ปิดวันศุกร์)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ทดสอบ (ไม่เรียก AI, ไม่ส่ง Telegram, ไม่บันทึก)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Weekly run
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.run_weekly --dry-run
          else
            python -m src.run_weekly
          fi

      - name: Commit results
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          git config user.name "ai-portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "weekly run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Alert on crash
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/ai_portfolio_alert_sent" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ AI Paper Portfolio: workflow ล้มเหลว — ดู log ที่ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
