name: Weekly run

on:
  schedule:
    - cron: "17 1 * * 6"   # ทุกวันเสาร์ ~08:17 เวลาไทย (หลังตลาด US ปิดวันศุกร์)
    - cron: "17 1 * * 0"   # วันอาทิตย์: รันซ่อมเฉพาะกรณีรอบวันเสาร์ล้มเหลว
  workflow_dispatch:
    inputs:
      mode:
        description: "โหมด"
        type: choice
        default: weekly
        options:
          - weekly          # รันปกติ
          - dry-run         # ทดสอบ ไม่เรียก AI ไม่ส่ง Telegram ไม่บันทึก
          - go-live-preview # AI เสนอพอร์ตตั้งต้น (ไม่บันทึก ไม่ซื้อจริง)
          - go-live         # AI สร้างพอร์ตตั้งต้นและเริ่มการทดลองจริง

permissions:
  contents: write

concurrency:
  group: portfolio
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Run
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MODE: ${{ inputs.mode || 'weekly' }}
          SUNDAY: ${{ github.event.schedule == '17 1 * * 0' }}
        run: |
          if [ "$SUNDAY" = "true" ]; then python -m src.run_weekly --retry; exit $?; fi
          case "$MODE" in
            dry-run)         python -m src.run_weekly --dry-run ;;
            go-live-preview) python -m src.run_weekly --go-live --preview ;;
            go-live)         python -m src.run_weekly --go-live ;;
            *)               python -m src.run_weekly ;;
          esac

      - name: Commit results
        if: ${{ success() && (inputs.mode == '' || inputs.mode == null || inputs.mode == 'weekly' || inputs.mode == 'go-live') }}
        run: |
          git config user.name "ai-portfolio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data config/rules.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "${MODE:-weekly} run $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main && git push
          fi
        env:
          MODE: ${{ inputs.mode || 'weekly' }}

      - name: Alert on crash
        if: ${{ failure() && inputs.mode != 'dry-run' }}
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "$RUNNER_TEMP/ai_portfolio_alert_sent" ]; then exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ AI Paper Portfolio: workflow ล้มเหลว — ดู log ที่ ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
